Liquid Glass Compact:
  primary-background-color: '#0a0d18'
  secondary-background-color: '#0f1320'
  card-background-color: rgba(20, 25, 40, 0.75)
  ha-card-background: rgba(20, 25, 40, 0.75)
  popup-background-color: '#0f1320'
  app-header-background-color: rgba(10, 13, 24, 0.85)
  app-header-text-color: '#ffffff'
  sidebar-background-color: '#0a0d18'
  mdc-theme-surface: '#0f1320'
  mdc-dialog-content-background: '#0f1320'
  mdc-dialog-scrim-color: rgba(0, 0, 0, 0.75)
  ha-dialog-surface-background: '#0f1320'
  mdc-snackbar-fill-color: '#0f1320'
  ha-toast-background-color: '#0f1320'
  ha-toast-text-color: '#f5f7fa'
  primary-text-color: '#f5f7fa'
  secondary-text-color: rgba(245, 247, 250, 0.65)
  primary-color: '#7ab8ff'
  light-primary-color: '#a8d0ff'
  dark-primary-color: '#2a6cb8'
  accent-color: '#ffb454'
  state-icon-color: rgba(245, 247, 250, 0.85)
  state-icon-active-color: '#ffb454'
  ha-card-border-radius: 16px
  ha-card-border-color: rgba(255, 255, 255, 0.1)
  ha-card-box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2)
  mush-control-border-radius: 14px
  mush-control-height: 36px
  mush-icon-border-radius: 12px
  mush-card-primary-font-size: 14px
  mush-card-secondary-font-size: 12px
  mush-rgb-amber: 255, 180, 84
  mush-rgb-blue: 122, 184, 255
  mush-rgb-cyan: 100, 220, 220
  mush-rgb-green: 74, 210, 149
  mush-rgb-orange: 255, 139, 74
  mush-rgb-pink: 255, 122, 168
  mush-rgb-purple: 157, 130, 230
  mush-rgb-red: 255, 90, 110
  mush-rgb-yellow: 255, 200, 100
  bubble-button-border-radius: 14px
  bubble-pop-up-border-radius: 20px
  glass-bg: rgba(255, 255, 255, 0.05)
  glass-bg-hover: rgba(255, 255, 255, 0.08)
  glass-border: 1px solid rgba(255, 255, 255, 0.1)
  glass-blur: blur(24px) saturate(1.3)
  glass-radius: 16px
  glass-radius-lg: 20px
  glass-shadow: 0 4px 16px rgba(0, 0, 0, 0.2)
  transition-duration: 150ms
  primary-font-family: '''Inter'', system-ui, ''Segoe UI'', Roboto, sans-serif'
  mdc-text-field-fill-color: rgba(255, 255, 255, 0.05)
  mdc-text-field-disabled-fill-color: rgba(255, 255, 255, 0.02)
  mdc-text-field-ink-color: '#f5f7fa'
  mdc-text-field-label-ink-color: rgba(245, 247, 250, 0.65)
  mdc-text-field-idle-line-color: rgba(255, 255, 255, 0.3)
  mdc-text-field-hover-line-color: rgba(255, 255, 255, 0.5)
  mdc-text-field-disabled-ink-color: rgba(245, 247, 250, 0.35)
  mdc-select-fill-color: rgba(255, 255, 255, 0.05)
  mdc-select-ink-color: '#f5f7fa'
  mdc-select-label-ink-color: rgba(245, 247, 250, 0.65)
  mdc-select-idle-line-color: rgba(255, 255, 255, 0.3)
  mdc-select-disabled-ink-color: rgba(245, 247, 250, 0.35)
  mdc-list-item-text-color: '#f5f7fa'
  mdc-list-item-graphic-color: rgba(245, 247, 250, 0.7)
  mwc-list-item-text-color: '#f5f7fa'
  paper-listbox-background-color: '#0f1320'
  paper-listbox-color: '#f5f7fa'
  paper-input-container-color: rgba(245, 247, 250, 0.65)
  paper-input-container-input-color: '#f5f7fa'
  paper-input-container-focus-color: '#7ab8ff'
  input-fill-color: rgba(255, 255, 255, 0.05)
  input-ink-color: '#f5f7fa'
  input-label-ink-color: rgba(245, 247, 250, 0.65)
  input-idle-line-color: rgba(255, 255, 255, 0.3)
  input-hover-line-color: rgba(255, 255, 255, 0.5)
  input-outlined-idle-border-color: rgba(255, 255, 255, 0.2)
  input-outlined-hover-border-color: rgba(255, 255, 255, 0.4)
  input-disabled-fill-color: rgba(255, 255, 255, 0.02)
  input-disabled-ink-color: rgba(245, 247, 250, 0.35)
  input-disabled-line-color: rgba(255, 255, 255, 0.15)
  mdc-text-field-outlined-idle-border-color: rgba(255, 255, 255, 0.2)
  mdc-text-field-outlined-hover-border-color: rgba(255, 255, 255, 0.4)
  mdc-text-field-outlined-disabled-border-color: rgba(255, 255, 255, 0.1)
  mdc-menu-surface-fill-color: '#0f1320'
  mdc-theme-text-primary-on-background: '#f5f7fa'
  mdc-theme-text-secondary-on-background: rgba(245, 247, 250, 0.65)
  mdc-theme-text-hint-on-background: rgba(245, 247, 250, 0.5)
  mdc-theme-text-disabled-on-background: rgba(245, 247, 250, 0.35)
  mdc-list-item-hover-state-layer-color: rgba(255, 255, 255, 0.08)
  mdc-list-item-hover-state-layer-opacity: '1'
  mdc-list-item-focus-state-layer-color: rgba(255, 255, 255, 0.12)
  mdc-button-disabled-fill-color: rgba(255, 255, 255, 0.05)
  mdc-button-disabled-ink-color: rgba(245, 247, 250, 0.35)
  mdc-button-outline-color: rgba(255, 255, 255, 0.2)
  color-scheme: dark
  wa-color-surface-default: '#0f1320'
  wa-color-surface-raised: '#141928'
  wa-color-surface-lowered: '#0a0d18'
  wa-color-text-normal: '#f5f7fa'
  wa-color-text-quiet: rgba(245, 247, 250, 0.65)
  wa-color-neutral-fill-quiet: rgba(255, 255, 255, 0.05)
  wa-color-neutral-fill-normal: rgba(255, 255, 255, 0.08)
  wa-color-neutral-border-normal: rgba(255, 255, 255, 0.2)
  wa-color-brand-fill-normal: '#7ab8ff'
  wa-color-brand-fill-loud: '#a8d0ff'
  wa-color-brand-on-loud: '#0a0d18'
  wa-color-brand-text-normal: '#7ab8ff'
  ha-color-form-background: rgba(255, 255, 255, 0.05)
  ha-color-form-background-hover: rgba(255, 255, 255, 0.08)
  ha-color-form-background-disabled: rgba(255, 255, 255, 0.02)
  ha-color-border-neutral-quiet: rgba(255, 255, 255, 0.1)
  ha-color-border-neutral-normal: rgba(255, 255, 255, 0.2)
  ha-color-border-neutral-loud: rgba(255, 255, 255, 0.3)
  ha-color-border-danger-normal: var(--error-color)
  ha-color-text-primary: var(--primary-text-color)
  ha-color-text-secondary: var(--secondary-text-color)
  ha-color-neutral-60: rgba(245, 247, 250, 0.5)
  md-sys-color-surface: var(--popup-background-color)
  md-sys-color-surface-container: var(--popup-background-color)
  md-sys-color-surface-container-low: var(--primary-background-color)
  md-sys-color-surface-container-high: var(--secondary-background-color)
  md-sys-color-surface-container-highest: var(--card-background-color)
  md-sys-color-surface-variant: var(--card-background-color)
  md-sys-color-on-surface: var(--primary-text-color)
  md-sys-color-on-surface-variant: var(--secondary-text-color)
  md-sys-color-primary: var(--primary-color)
  md-sys-color-on-primary: var(--text-primary-color)
  md-sys-color-secondary-container: var(--sidebar-selected-background-color)
  md-sys-color-on-secondary-container: var(--primary-color)
  md-sys-color-outline: var(--outline-color)
  md-sys-color-outline-variant: var(--divider-color)
  md-sys-color-background: var(--primary-background-color)
  md-sys-color-on-background: var(--primary-text-color)
  md-list-item-label-text-color: var(--primary-text-color)
  md-list-item-supporting-text-color: var(--secondary-text-color)
  md-list-item-leading-icon-color: var(--state-icon-color)
  md-list-item-container-color: transparent
  ha-color-fill-primary-loud-resting: var(--dark-primary-color)
  ha-color-fill-primary-loud-hover: var(--primary-color)
  ha-color-fill-primary-loud-active: var(--dark-primary-color)
  ha-color-fill-primary-normal-resting: var(--dark-primary-color)
  ha-color-fill-primary-normal-hover: var(--primary-color)
  ha-color-fill-primary-normal-active: var(--dark-primary-color)
  ha-color-on-primary-quiet: var(--primary-text-color)
  ha-color-on-primary-normal: var(--primary-text-color)
  ha-color-on-primary-loud: var(--text-primary-color)
  card-mod-theme: Liquid Glass Compact
  card-mod-card: |
    :where(ha-card) {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--glass-radius);
      box-shadow: var(--glass-shadow);
      transition: all var(--transition-duration) var(--transition-timing-function);
    }
    :where(ha-card:hover) {
      background: var(--glass-bg-hover);
    }
    :host(.type-heading) ha-card,
    :host(hui-heading-card) ha-card {
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
    }
  modes:
    dark: {}
