  card-mod-view-yaml: |
    # Badges aligned left old style
    "*:first-child$": |
      .badges, #badges {
      display: flex !important;
      justify-content: flex-start;
      margin: 0px !important;
      justify-content: left !important;
      }

    "hui-sections-view $": 
        # Badges aligned left sections
        "hui-view-badges $": 
          #.: |
          #  :host {
          #    margin: 8px !important;
          #  }
          #  .badges, #badges {
          #    display: flex !important;
          #    justify-content: flex-start;
          #    margin: 0px !important;
          #    justify-content: left !important;
          #  }
            
          "hui-entity-badge $": 
            "ha-badge $": |
              .badge {
                padding: 0px 0.75em 0px 0.75em !important;
                border-radius: 0px !important;
              }
              ::slotted(img[slot="icon"]) {
                border-radius: 0px !important;
              }
        "hui-grid-section $":
          .: |
            .card.fit-rows {
              height: auto !important;
            }

    "hui-masonry-view $": 
        # Badges aligned left 2024.8 style
        "hui-view-badges $": 
          .: |
            :host {
              margin: 8px !important;
            }
            .badges, #badges {
              display: flex !important;
              justify-content: flex-start;
              margin: 0px !important;
              justify-content: left !important;
            }
            
          "hui-entity-badge $": 
            "ha-badge $": |
              .badge {
                padding: 0px 0.75em 0px 0.75em !important;
                border-radius: 0px !important;
              }
              ::slotted(img[slot="icon"]) {
                border-radius: 0px !important;
              }
  card-mod-badge-yaml: |
    .: |
      .badge: {
        padding: 2px 8px !important;
        border-radius: 0px !important;
      }
      :host {
        background-color: var(--secondary-background-color);
        border-radius: 0px;
        border: 0px;
        padding: 0px;
        margin: 4px;
        box-shadow: none;
      }
      img {
        border-radius: 0% !important;
      }
    ha-state-label-badge $ ha-label-badge $: |
            .label-badge {
                height: 3.5em !important;
                color: var(--primary-color) !important;
                border-radius: 0px !important;
                background: none !important;
                border: 0px !important;
                border-bottom: solid 1px !important;
            }
            .label-badge .label {
                position: static !important;
            }
            .label-badge .label span {
                border-radius: 0px !important;
                width: 100% !important;
                background: none !important;
                color: var(--primary-color) !important;
            }
            .title {
                height: 100% !important;
                vertical-align: bottom !important;
                margin-top: 5% !important;
                margin-bottom: 5% !important;
                position: static !important;
            }
  card-mod-more-info-yaml: |
    .: |
      .mdc-dialog .mdc-dialog__container .mdc-dialog__surface {
        box-shadow: none;
        border-radius: 0px;
      }
      ha-control-switch {
        border-radius: 0px !important;
      }
    ha-dialog-header: |
        .mdc-top-app-bar {
          background: var(--primary-color) !important;
          color: var(--primary-background-color) !important;
        }   
  card-mod-card-yaml: |
    .: |
      ha-card.type-heading .content {
        --mdc-icon-size: 22px !important;
      }
      ha-card.type-custom-vacuum-card {
        border-radius: 0px;
      }
      ha-card.type-custom-vacuum-card .preview {
        background: none;
      }
      ha-card.type-custom-vacuum-card .header {
        color: var(--primary-text-color)
      }
      ha-card.type-custom-vacuum-card .status-text {
        color: var(--primary-text-color)
      }
      ha-card.type-custom-vacuum-card ha-icon {
        color: var(--primary-text-color)
      }
      ha-card.type-custom-vacuum-card .stats {
        color: var(--primary-text-color)
      }
      ha-card.type-custom-vacuum-card .vacuum-name {
        color: var(--primary-text-color)
      }
      ha-card.type-custom-vacuum-card .not-available {
        color: var(--disabled-text-color)
      }
      ha-card.type-custom-vacuum-card .source {
        color: var(--primary-color)
      }
      ha-card.type-custom-vacuum-card .source ha-icon {
        color: var(--primary-color)
      }
      ha-card.type-custom-mini-graph-card .graph__labels > span {
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 0.05em 0.5em !important;
        background-color: var(--primary-color) !important;
        color: var(--primary-background-color) !important;
      }
      ha-card.type-custom-mini-graph-card .name .ellipsis {
        opacity: 1 !important;
        font-weight: normal !important;
      }
      ha-card.type-custom-zha-network-card th {
        background-color: var(--primary-color);
        color: var(--primary-background-color);
      }
    # Custom sonos card
    sonos-player$: 
      .: |
        .header, .controls {
           border-radius: 0px !important;
         }
      sonos-player-controls$: 
        sonos-volume$: 
          ha-control-slider$: |
            [class*="slider"] {
              border-radius: 0px !important;
            }
            .slider .slider-track-background {
              background: none !important;
            }
            .slider .slider-track-bar {
              top: 40% !important;
              bottom: 0px !important;
              height: 20% !important;
            }
            .slider .slider-track-bar::after {
              top: 0px !important;
              bottom: 0px !important;
              right: calc(var(--control-slider-thickness) * -0.2) !important;
              height: 200% !important;
              width: auto !important;
              aspect-ratio: 1 / 1 !important;
              background-color: var(--primary-text-color) !important;
              border-radius: 50% !important;
            }
            .tooltip {
              border-radius: 0px !important;
            }
    sonos-volumes$: 
      sonos-volume$: 
        ha-control-slider$: |
          [class*="slider"] {
            border-radius: 0px !important;
          }
          .slider .slider-track-background {
            background: none !important;
          }
          .slider .slider-track-bar {
            top: 40% !important;
            bottom: 0px !important;
            height: 20% !important;
          }
          .slider .slider-track-bar::after {
            top: 0px !important;
            bottom: 0px !important;
            right: calc(var(--control-slider-thickness) * -0.2) !important;
            height: 200% !important;
            width: auto !important;
            aspect-ratio: 1 / 1 !important;
            background-color: var(--primary-text-color) !important;
            border-radius: 50% !important;
          }
          .tooltip {
            border-radius: 0px !important;
          }
    sonos-groups$:
      sonos-group$: |
        mwc-list-item[hasmeta] {
          border-radius: 0;
        }
    sonos-grouping$:
      sonos-grouping-button$: |
        ha-control-button {
          --control-button-border-radius: 0;
        }
      .: |
        ha-control-button {
          --control-button-border-radius: 0;
        }
      sonos-volume$:
        ha-control-slider$: |
          .slider {
            border-radius: 0 !important;
          }
          .slider-track-bar {
            border-radius: 0 !important;
          }
          
    sonos-media-browser$:
      sonos-media-browser-icons$: 
        .: |
          .title {
            color: white !important;
            font-weight: lighter !important;
            background-color: var(--primary-color) !important;
          }
        ha-control-button$: |
          button {            
            border-radius: 0 !important;
          } 
          
  card-mod-row-yaml: |
    # Square icon
    "*:first-child$": |
      state-badge {
        border-radius: 0% !important;
      }
