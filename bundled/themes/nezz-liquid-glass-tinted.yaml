Liquid Glass Tinted:
  modes:
    light:
      background-image: center / cover no-repeat fixed url('https://raw.githubusercontent.com/Nezz/homeassistant-visionos-theme/refs/heads/static/macOS_27_Light.webp')
      primary-background-color: rgb(242, 242, 247)
      secondary-background-color: rgb(242, 242, 247)
      app-header-background-color: rgba(245, 245, 247, 0.6)
      ha-card-background: rgba(245, 245, 247, 0.6)
      app-theme-color: rgb(206, 199, 194)
      ha-card-backdrop-filter: blur(12px) saturate(1.3)
      ha-dialog-surface-background: color-mix(in srgb, rgba(245, 245, 247, 0.8), var(--ha-color-neutral-50) 0%)
      bar-box-shadow: inset 0 0 0 100vmax rgba(245, 245, 247, 0.15), 0 0.5px 0 rgba(0, 0, 0, 0.15)
      glass-edge-color: rgba(0, 0, 0, 0.1)
      glass-contrast-background: rgba(255, 255, 255, 0.95)
      glass-contrast-outline: rgba(0, 0, 0, 0.5)
      light-primary-color: '#b3e5fc'
      sidebar-icon-color: var(--state-icon-color)
      sidebar-text-color: var(--primary-text-color)
      sidebar-selected-icon-color: var(--state-icon-color)
      sidebar-selected-text-color: var(--primary-text-color)
      disabled-color: rgb(120, 120, 128)
      state-icon-color: rgba(0, 0, 0, 0.7)
      state-climate-heat-color: '#C93400'
      bubble-secondary-background-color: rgba(0, 0, 0, 0.06)
      bubble-icon-background-color: rgba(255, 255, 255, 0.7)
      energy-gas-color: '#D70015'
      divider-color: rgba(60, 60, 67, 0.2)
      primary-text-color: rgba(0, 0, 0, 0.85)
      secondary-text-color: rgba(60, 60, 67, 0.6)
      disabled-text-color: rgba(60, 60, 67, 0.3)
      paper-item-icon-color: var(--state-icon-color)
      mini-media-player-base-color: var(--primary-text-color)
      mini-media-player-icon-color: var(--state-icon-color)
      app-header-edit-background-color: rgba(255, 255, 255, 0.6)
      markdown-code-background-color: rgba(0, 0, 0, 0.06)
      code-editor-background-color: rgb(250, 250, 250)
      mdc-checkbox-unchecked-color: rgba(60, 60, 67, 0.6)
      mdc-radio-unchecked-color: rgba(60, 60, 67, 0.6)
      wa-color-neutral-fill-normal: '#0000000D'
      ha-color-fill-primary-quiet-resting: rgba(0, 0, 0, 0.06)
      ha-color-fill-primary-quiet-hover: rgba(0, 0, 0, 0.1)
      red-color: '#FF3B30'
      pink-color: '#FF2D55'
      purple-color: '#AF52DE'
      indigo-color: '#5856D6'
      blue-color: '#007AFF'
      light-blue-color: '#00C7BE'
      cyan-color: '#32ADE6'
      teal-color: '#30B0C7'
      green-color: '#34C759'
      yellow-color: '#FFCC00'
      orange-color: '#FF9500'
      brown-color: '#A2845E'
    dark:
      background-image: center / cover no-repeat fixed url('https://raw.githubusercontent.com/Nezz/homeassistant-visionos-theme/refs/heads/static/macOS_27_Dark.webp')
      primary-background-color: rgb(28, 28, 30)
      secondary-background-color: rgb(28, 28, 30)
      app-header-background-color: rgba(58, 58, 60, 0.6)
      ha-card-background: rgba(58, 58, 60, 0.6)
      ha-card-backdrop-filter: blur(12px) saturate(1.3)
      ha-dialog-surface-background: color-mix(in srgb, rgba(58, 58, 60, 0.8), var(--ha-color-neutral-50) 0%)
      bar-box-shadow: inset 0 0 0 100vmax rgba(58, 58, 60, 0.15), 0 0.5px 0 rgba(0, 0, 0, 0.4)
      secondary-text-color: rgba(235, 235, 245, 0.6)
      glass-edge-color: rgba(0, 0, 0, 0.15)
      glass-contrast-background: rgba(0, 0, 0, 0.8)
      glass-contrast-outline: rgba(255, 255, 255, 0.6)
      app-theme-color: rgb(0, 0, 0)
      light-primary-color: '#b3e5fc'
      sidebar-icon-color: rgb(241, 241, 241)
      sidebar-text-color: rgb(241, 241, 241)
      disabled-color: rgb(160, 160, 168)
      history-unknown-color: '#AEAEB2'
  lovelace-background: var(--background-image)
  light-primary-color: rgb(241, 241, 241)
  divider-color: rgba(152, 152, 157, 0.3)
  accent-color: var(--primary-color)
  primary-text-color: rgba(255, 255, 255, 0.96)
  secondary-text-color: rgba(222, 222, 222, 0.96)
  ha-color-text-secondary: var(--secondary-text-color)
  text-primary-color: var(--primary-text-color)
  disabled-text-color: rgba(208, 208, 208, 0.5)
  sidebar-background-color: var(--secondary-background-color)
  sidebar-icon-color: var(--light-primary-color)
  sidebar-text-color: var(--light-primary-color)
  sidebar-selected-icon-color: var(--primary-text-color)
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)
  state-icon-color: var(--primary-text-color)
  state-icon-active-color: var(--yellow-color)
  state-icon-unavailable-color: var(--disabled-text-color)
  state-inactive-color: var(--disabled-text-color)
  paper-item-icon-active-color: var(--state-icon-active-color)
  ha-slider-background: none !important
  label-badge-background-color: '#23232E'
  label-badge-text-color: '#F1F1F1'
  label-badge-red: rgba(255, 159, 9, 0.7)
  card-background-color: var(--secondary-background-color)
  ha-card-border-radius: 34px
  ha-card-features-border-radius: var(--ha-card-border-radius)
  rgb-card-background-color: rgb(10, 10, 10)
  ha-card-border-width: 0
  ha-card-box-shadow: |
    3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.7) inset, -2px -2px 0.5px -2px rgba(255, 255, 255, 0.55) inset, 0 0 8px 1px rgba(255, 255, 255, 0.18) inset, 0 0 0 0.5px var(--glass-edge-color), 0 0.5px 1px 0 rgba(0, 0, 0, 0.12)
  table-row-background-color: var(--primary-background-color)
  table-row-alternative-background-color: var(--secondary-background-color)
  ha-dialog-surface-backdrop-filter: var(--ha-card-backdrop-filter) blur(calc(0 * var(--ha-space-1)))
  dialog-box-shadow: var(--ha-card-box-shadow)
  ha-dialog-scrim-backdrop-filter: none
  app-header-backdrop-filter: var(--ha-card-backdrop-filter)
  app-header-edit-background-color: rgba(0, 0, 0, 0.2)
  app-header-border-bottom: none
  red-color: '#FF453A'
  pink-color: '#FF375F'
  purple-color: '#BF5AF2'
  indigo-color: '#5E5CE6'
  blue-color: '#0A84FF'
  light-blue-color: '#66D4CF'
  cyan-color: '#5AC8F5'
  teal-color: '#6AC4DC'
  green-color: '#32D74B'
  yellow-color: '#FFD60A'
  orange-color: '#FF9F0A'
  brown-color: '#AC8E68'
  graph-color-1: var(--cyan-color)
  energy-grid-consumption-color: var(--cyan-color)
  energy-grid-return-color: var(--purple-color)
  energy-solar-color: var(--orange-color)
  energy-battery-out-color: var(--green-color)
  energy-battery-in-color: var(--pink-color)
  energy-gas-color: var(--red-color)
  energy-water-color: var(--light-blue-color)
  primary-color: var(--orange-color)
  ha-color-primary-05: '#331f00'
  ha-color-primary-10: '#663d00'
  ha-color-primary-20: '#995c00'
  ha-color-primary-30: '#cc7a00'
  ha-color-primary-40: var(--primary-color)
  ha-color-primary-50: '#ffa31a'
  ha-color-primary-60: '#ffad33'
  ha-color-primary-70: '#ffc266'
  ha-color-primary-80: '#ffd699'
  ha-color-primary-90: '#ffebcc'
  ha-color-primary-95: '#fff5e6'
  paper-item-icon-color: white
  markdown-code-background-color: '#464646'
  code-editor-background-color: '#161616'
  clear-background-color: var(--ha-card-background)
  mdc-theme-surface: var(--secondary-background-color)
  mdc-checkbox-unchecked-color: '#FFF'
  mdc-radio-unchecked-color: '#FFF'
  mcg-title-letter-spacing: .15em
  mini-media-player-base-color: white
  mini-media-player-icon-color: white
  input-ink-color: var(--primary-text-color)
  input-fill-color: transparent
  input-disabled-fill-color: transparent
  input-label-ink-color: var(--primary-text-color)
  input-disabled-ink-color: var(--disabled-text-color)
  input-dropdown-icon-color: var(--primary-text-color)
  input-idle-line-color: var(--secondary-text-color)
  input-hover-line-color: var(--secondary-text-color)
  codemirror-property: var(--accent-color)
  md-list-container-color: none
  wa-shadow-m: var(--ha-card-box-shadow)
  wa-border-radius-s: var(--ha-card-border-radius)
  wa-border-radius-m: 24px
  wa-border-width-s: 0px
  ha-color-on-neutral-normal: var(--primary-text-color)
  wa-color-neutral-fill-normal: '#FFFFFF14'
  ha-color-form-background: var(--ha-card-background)
  ha-color-form-background-hover: var(--ha-card-background)
  ha-color-form-background-disabled: var(--ha-card-background)
  ha-color-fill-primary-quiet-resting: rgba(255, 255, 255, 0.12)
  ha-color-fill-primary-quiet-hover: rgba(255, 255, 255, 0.2)
  bubble-main-background-color: var(--ha-card-background)
  bubble-secondary-background-color: rgba(255, 255, 255, 0.1)
  bubble-icon-background-color: rgba(0, 0, 0, 0.2)
  bubble-horizontal-buttons-stack-background-color: transparent
  bubble-media-player-play-pause-icon-color: var(--primary-text-color)
  bubble-pop-up-main-background-color: var(--ha-card-background)
  bubble-select-list-background-color: var(--card-background-color)
  wa-form-control-padding-inline: var(--ha-space-3)
  card-mod-theme: Liquid Glass Tinted
  card-mod-drawer: |
    .mdc-drawer {
      background-color: var(--app-header-background-color) !important;
      backdrop-filter: var(--ha-card-backdrop-filter);
    }

    .sidebar-shell {
      background-color: var(--app-header-background-color) !important;
    }

    wa-drawer::part(dialog) {
      backdrop-filter: var(--ha-card-backdrop-filter);
      background-color: var(--app-header-background-color) !important;
      box-shadow: none !important;
    }
  card-mod-sidebar: |
    :host {
      background: none !important;
      backdrop-filter: var(--ha-card-backdrop-filter);
    }

    .menu {
      border-bottom-color: transparent !important;
    }

    ha-list-item-button,
    ha-list-item-button.selected::before {
      border-radius: var(--ha-card-border-radius) !important;
      --ha-list-item-focus-radius: var(--ha-card-border-radius) !important;
    }

    ha-md-list-item,
    ha-md-list-item.selected::before {
      border-radius: var(--ha-card-border-radius) !important;
    }
  card-mod-root: |
    ha-tab-group::part(scroll-button) {
      background: none !important;
    }

    ha-tab-group::part(nav) {
      mask:
        linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent),
        linear-gradient(#000, #000) bottom / 100% 4px no-repeat;
    }

    ha-menu-button,
    .action-items > * {
      color: var(--state-icon-color);
    }
  card-mod-state-history-charts: |
    .entry-container:first-of-type {
      border-top: none !important;
      margin-top: 0 !important;
    }

    .entry-container.timeline:first-of-type {
      margin-top: var(--timeline-top-margin) !important;
    }
  card-mod-card: |
    ha-card {
      backdrop-filter: unset !important;
    }
    ha-card::before {
      content: '';
      position: absolute;
      inset: 0;
      backdrop-filter: var(--ha-card-backdrop-filter);
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
    }
    :host(hui-heading-card) ha-card {
      background: none !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    :host(hui-heading-card) ha-card::before {
      content: none !important;
    }

    .mdc-data-table,
    .mdc-data-table__row,
    .mdc-data-table__header-cell,
    ha-sankey-chart {
      background: none !important;
    }

    ha-card.text-only {
      background: none !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
      overflow: visible;
    }
    ha-card.text-only::before {
      content: none !important;
    }

    :host(mushroom-title-card) ha-card {
      background: none !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    :host(mushroom-title-card) ha-card::before {
      content: none !important;
    }

    :host(mushroom-chips-card) ha-card {
      background: none !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
    }
    :host(mushroom-chips-card) ha-card::before {
      content: none !important;
      background: none !important;
      backdrop-filter: none !important;
    }

    :host(:not(bubble-card)) ha-card[style*="box-shadow: none"] {
      background: transparent !important;
    }
    :host(:not(bubble-card)) ha-card[style*="box-shadow: none"]::before {
      content: none !important;
    }

    :host(expander-card) ha-card.clear::before {
      content: none !important;
    }

    :host(mod-card) ha-card::before {
      content: none !important;
    }

    :host(mini-media-player) ha-card::before {
      position: static;
      backdrop-filter: none;
      box-shadow: none;
      z-index: auto;
    }
    :host(mini-media-player) ha-card::after {
      content: '';
      position: absolute;
      inset: 0;
      backdrop-filter: var(--ha-card-backdrop-filter);
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
    }

    :host(navbar-card) {
      --navbar-background-color: var(--ha-card-background);
      --navbar-box-shadow-desktop: var(--ha-card-box-shadow);
      --navbar-box-shadow-mobile-floating: var(--ha-card-box-shadow);
      --navbar-border-radius: 999px;
    }
    :host(navbar-card) .navbar-card.desktop.top:not(.docked),
    :host(navbar-card) .navbar-card.desktop.bottom:not(.docked),
    :host(navbar-card) .navbar-card.mobile.floating {
      padding: 6px !important;
      gap: 0 !important;
    }
    :host(navbar-card) .navbar-card.desktop.top:not(.docked) .route,
    :host(navbar-card) .navbar-card.desktop.bottom:not(.docked) .route {
      flex: 1;
    }
    :host(navbar-card) .route {
      border-radius: 999px;
    }
    :host(navbar-card) .navbar-card:not(.left):not(.right) .route {
      height: auto !important;
      padding: 5px 0;
    }
    :host(navbar-card) .button ha-ripple {
      inset: -100px !important;
    }
    :host(navbar-card) .navbar-card:not(.left):not(.right) .route:has(.label) .button {
      height: calc(var(--navbar-route-icon-size) + 4px) !important;
    }
    :host(navbar-card) .route .label {
      line-height: 14px;
      position: relative;
    }
    :host(navbar-card) .route .button.active {
      background: color-mix(in srgb, var(--primary-text-color) 12%, transparent);
      box-shadow: 0 0 0 100px color-mix(in srgb, var(--primary-text-color) 12%, transparent);
      border-radius: 0;
    }
    :host(navbar-card) .label.active {
      color: var(--navbar-primary-color);
    }
    :host(navbar-card) .popup-item .button {
      backdrop-filter: var(--ha-card-backdrop-filter);
      border-radius: 999px;
    }
    :host(navbar-card) .media-player-bg {
      opacity: 0.15 !important;
    }

    :host(bubble-card) ha-card:has(.bubble-separator)::before,
    :host(bubble-card) ha-card.horizontal-buttons-stack-card::before {
      content: none !important;
    }

    :host(bubble-card) ha-card::before {
      border-radius: var(--bubble-border-radius, calc(var(--row-height, 56px) / 2));
      box-shadow: none;
    }

    :host(bubble-card) ha-card:not(.horizontal-buttons-stack-card):not(:has(.bubble-separator))::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--bubble-border-radius, calc(var(--row-height, 56px) / 2));
      box-shadow: var(--ha-card-box-shadow);
      pointer-events: none;
      z-index: 1;
    }

    :host(bubble-card) .bubble-background.bubble-action:not(.bubble-cover-background),
    :host(bubble-card) .bubble-range-fill {
      opacity: 0.5 !important;
    }

    :host(bubble-card) .bubble-play-pause-button {
      background-color: color-mix(in srgb, var(--bubble-accent-color, var(--bubble-default-color)) 50%, transparent) !important;
    }

    :host(bubble-card) .bubble-sub-button.background-on:not(.is-select) {
      background-color: color-mix(in srgb, var(--bubble-sub-button-light-background-color, var(--bubble-accent-color, var(--bubble-default-color))) 50%, transparent) !important;
    }

    :host(bubble-card) .horizontal-buttons-stack-card .bubble-button {
      background-color: var(--ha-card-background);
      backdrop-filter: var(--ha-card-backdrop-filter);
      box-shadow: var(--ha-card-box-shadow);
    }

    :host(bubble-card) .horizontal-buttons-stack-card .card-content {
      mask-image: none !important;
    }

    :host(bubble-card) .horizontal-buttons-stack-card .bubble-background-color {
      border-color: transparent !important;
    }

    :host(bubble-card) .bubble-header .bubble-button-card-container,
    :host(bubble-card) .bubble-header-action-button {
      box-shadow: var(--ha-card-box-shadow);
    }

    :host(bubble-card) .bubble-pop-up {
      --bubble-pop-up-background-color: var(--ha-dialog-surface-background) !important;
    }

    ha-card:has(ha-tile-icon[data-domain="light"], ha-tile-icon[data-domain="cover"], ha-tile-icon[data-domain="humidifier"], ha-tile-icon[data-domain="climate"]) hui-card-features,
    :host(hui-humidifier-card) hui-card-features,
    :host(hui-thermostat-card) hui-card-features {
      --ha-border-radius-md: 0px;
    }

    hui-card-features {
      --thumb-border-radius: 0px;
      --primary-text-color: var(--state-icon-color);
    }

    @media (prefers-contrast: more) {
      ha-card {
        background-color: var(--glass-contrast-background) !important;
        box-shadow: 0 0 0 1px var(--glass-contrast-outline) !important;
      }
    }
