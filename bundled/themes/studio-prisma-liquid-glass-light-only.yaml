  wa-color-surface-default: '#ffffff'
  wa-color-surface-raised: '#ffffff'
  wa-color-surface-lowered: '#f5f3ee'
  wa-color-text-normal: '#1a1d24'
  wa-color-text-quiet: rgba(26, 29, 36, 0.65)
  wa-color-neutral-fill-quiet: rgba(0, 0, 0, 0.05)
  wa-color-neutral-fill-normal: rgba(0, 0, 0, 0.08)
  wa-color-neutral-border-normal: rgba(0, 0, 0, 0.2)
  wa-color-brand-fill-normal: '#3a7fcf'
  wa-color-brand-fill-loud: '#1d4f8f'
  wa-color-brand-on-loud: '#ffffff'
  wa-color-brand-text-normal: '#3a7fcf'
  ha-color-form-background: rgba(0, 0, 0, 0.05)
  ha-color-form-background-hover: rgba(0, 0, 0, 0.08)
  ha-color-form-background-disabled: rgba(0, 0, 0, 0.02)
  ha-color-border-neutral-quiet: rgba(0, 0, 0, 0.1)
  ha-color-border-neutral-normal: rgba(0, 0, 0, 0.2)
  ha-color-border-neutral-loud: rgba(0, 0, 0, 0.3)
  ha-color-border-danger-normal: var(--error-color)
  ha-color-text-primary: var(--primary-text-color)
  ha-color-text-secondary: var(--secondary-text-color)
  ha-color-neutral-60: rgba(26, 29, 36, 0.5)
  md-sys-color-surface: var(--popup-background-color)
  md-sys-color-surface-container: var(--popup-background-color)
  md-sys-color-surface-container-low: var(--primary-background-color)
  md-sys-color-surface-container-high: var(--secondary-background-color)
  md-sys-color-surface-container-highest: var(--card-background-color)
  md-sys-color-surface-variant: var(--card-background-color)
  md-sys-color-on-surface: var(--primary-text-color)
  md-sys-color-on-surface-variant: var(--secondary-text-color)
  md-sys-color-primary: var(--primary-color)
  md-sys-color-on-primary: var(--text-primary-color)
  md-sys-color-secondary-container: var(--sidebar-selected-background-color)
  md-sys-color-on-secondary-container: var(--primary-color)
  md-sys-color-outline: var(--outline-color)
  md-sys-color-outline-variant: var(--divider-color)
  md-sys-color-background: var(--primary-background-color)
  md-sys-color-on-background: var(--primary-text-color)
  md-list-item-label-text-color: var(--primary-text-color)
  md-list-item-supporting-text-color: var(--secondary-text-color)
  md-list-item-leading-icon-color: var(--state-icon-color)
  md-list-item-container-color: transparent
  card-mod-theme: Liquid Glass Light only
  card-mod-card: |
    :where(ha-card) {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: var(--glass-radius);
      box-shadow: var(--glass-shadow);
      transition: all var(--transition-duration) var(--transition-timing-function);
    }
    :where(ha-card:hover) {
      background: var(--glass-bg-hover);
    }
    :host(.type-heading) ha-card,
    :host(hui-heading-card) ha-card {
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
    }
  modes:
    light: {}
