name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            script: dist:mac
          - name: Windows (x64)
            os: windows-latest
            script: dist:win
          - name: Linux (x64)
            os: ubuntu-24.04
            script: dist:linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Make sure unzip is available
        if: runner.os == 'Windows'
        shell: bash
        run: command -v unzip || choco install unzip -y --no-progress
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: hats-${{ runner.os }}
          path: |
            release/HATS-*
          if-no-files-found: error
      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/HATS-*.dmg
            release/HATS-*.zip
            release/HATS-*.exe
            release/HATS-Setup-*.exe
            release/HATS-*.AppImage
            release/HATS-*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
