name: "HATS - Home Assistant Theme Store"
slug: "hats"
version: "1.2.5"
description: "Visual Theme Designer, Live Lovelace Sandbox, Direct Theme Installer, and Community Store inside Home Assistant."
url: "https://github.com/HomeRiz/hats"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: true
startup: services
boot: auto
ingress: true
ingress_port: 4287
panel_icon: "mdi:palette-swatch"
panel_title: "HATS"
ports:
  4287/tcp: 4287
ports_description:
  4287/tcp: "Direct Web UI (Fullscreen in New Tab)"
webui: "http://[HOST]:[PORT:4287]"
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - config:rw
  - share:rw
options:
  themes_directory: "/config/themes"
  backgrounds_directory: "/config/www/ultimate-theme/backgrounds"
  auto_reload_themes: true
schema:
  themes_directory: str
  backgrounds_directory: str
  auto_reload_themes: bool
