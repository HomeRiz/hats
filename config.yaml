name: "HATS - Home Assistant Theme Store"
slug: "hats"
version: "1.2.1"
description: "Visual Theme Designer, Live Lovelace Sandbox, Direct Theme Installer, and Community Store inside Home Assistant."
url: "https://github.com/HomeRiz/hats"
arch:
  - aarch64
  - amd64
startup: services
ingress: true
ingress_port: 4287
panel_icon: "mdi:hat-fedora"
panel_title: "HATS"
homeassistant_api: true
map:
  - type: homeassistant_config
    path: /config
    read_only: false
options:
  themes_directory: "/config/themes"
  backgrounds_directory: "/config/www/hats/backgrounds"
  auto_reload_themes: true
schema:
  themes_directory: str
  backgrounds_directory: str
  auto_reload_themes: bool
  github_token: password?
